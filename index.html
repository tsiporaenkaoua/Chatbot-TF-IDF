 <style>
 :root{
 --bg: #0b1020;
 --panel: #11162a;
 --text: #e8eaf5;
 --sub: #9aa4c4;
 --accent: #6d8bff;
 --accent-2:#8b5cf6;

 --bot:#303d72;
 --input:#0f1530;
 --border:#232a4a;
 --shadow: 0 10px 30px rgba(0,0,0,.35);
 --radius: 16px;
 }
 .light{
 --bg:#f6f7fb;
 --panel:#ffffff;
 --text:#111528;
 --sub:#5a637a;
 --accent:#3d5afe;
 --accent-2:#7c3aed;
 --user:#2563eb;
 --bot:#eef2ff;
 --input:#f3f4f9;
 --border:#e5e7f2;
 --shadow: 0 12px 30px rgba(23,35,85,.08);
 }
 *{box-sizing:border-box}
 body{
  margin:0; 
  background: radial-gradient(1200px 600px at 10% -10%, rgba(109,139,255,.25), transparent 60%),
  radial-gradient(1000px 500px at 110% 10%, rgba(139,92,246,.18), transparent 60%),
  var(--bg);
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
  color:var(--text); 
  min-height:100dvh; 
  display:flex;
    align-items:center; 
  justify-content:center; 
  padding:24px;
 }
 .app{
  width:min(920px,100%); height:min(82dvh, 900px);
  background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0.00) 120%), var(--panel);
  border:1px solid var(--border); border-radius:24px;
  box-shadow: var(--shadow);
  display:flex; 
  flex-direction:column; 
  overflow:hidden; 
  position:relative;
 }
 .header{
 display:flex;
  align-items:center; 
  justify-content:space-between;
   padding:18px 20px; 
   border-bottom:1px solid var(--border);
 background:linear-gradient(90deg, rgba(109,139,255,.15), rgba(139,92,246,.15));
 }
 .brand{ 
  display:flex; 
  align-items:center; 
  gap:12px; }
 .logo{
 width:36px; height:36px; border-radius:12px;
 background: conic-gradient(from 220deg, var(--accent), var(--accent-2));
 filter: drop-shadow(0 6px 16px rgba(109,139,255,.35));
 }
 .title{ font-weight:700; letter-spacing:.2px }
 .subtitle{ color:var(--sub); font-size:12px }
 .actions{ display:flex; align-items:center; gap:10px }
 .btn{
 border:1px solid var(--border); background:var(--input); color:var(--text);
 padding:10px 14px; border-radius:12px; cursor:pointer; transition:.15s eas
e;
 font-weight:600; font-size:14px;
 }
 .btn:hover{ transform: translateY(-1px); }
 .btn.primary{ background: linear-gradient(90deg, var(--accent), var(--acce
nt-2)); border-color: transparent; color:white; }
 .btn.ghost{ background:transparent; }
 .chat{
 flex:1; overflow:auto; padding:22px; display:flex; flex-direction:column; gap:14px;
 scroll-behavior:smooth;
 }
 .bubble{
 max-width:min(76%, 680px); padding:12px 14px; border-radius:18px; lineheight:1.35;
 border:1px solid var(--border); white-space:pre-wrap;
 }
 .msg{
 display:flex; gap:10px; align-items:flex-end;
 animation: pop .12s ease-out forwards;
 }
 .msg.user{ justify-content:flex-end; }
 .msg.user .bubble{ background: var(--user); color:white; border-color: tran
sparent; }
 .msg.bot .bubble{ background: var(--bot); }
 .msg .time{ color:var(--sub); font-size:11px; margin:0 6px; user-select:none;
}
 @keyframes pop { from{ transform: translateY(4px); opacity:0 } to { transform:none; opacity:1 } }
 .composer{
 padding:14px; border-top:1px solid var(--border); background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0) 120%);
 display:flex; gap:10px; align-items:center;
 }
 .input{
 flex:1; display:flex; gap:10px; align-items:center; border:1px solid var(--border); background:var(--input);
 padding:10px 12px; border-radius:14px;
 }
 .input input{
 flex:1; border:none; outline:none; background:transparent; color:var(--text); font-size:15px;
 }
 .hint{ color:var(--sub); font-size:12px; padding:0 6px 10px; }
 .suggest{ display:flex; gap:8px; flex-wrap:wrap; padding:0 22px 10px; }
 .chip{
 font-size:13px; padding:8px 10px; border:1px solid var(--border); border-radius:999px; cursor:pointer;
 background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,
255,0) 120%);
 }
 .chip:hover{ transform: translateY(-1px); }
 .footer-note{
 position:absolute; bottom:8px; right:14px; color:var(--sub); font-size:11px;
user-select:none;
 }
 .kbd{ border:1px solid var(--border); padding:1px 6px; border-radius:6px; font-size:11px; }
 </style>
</head>
<body class="">
 <div class="app" id="app">
 <div class="header">
Un mini-chatbot 19
 <div class="brand">
 <div class="logo"></div>
 <div>
 <div class="title">Mini Chatbot — TF-IDF (sans API)</div>
 <div class="subtitle">FAQ + similarité cosinus • règles (heure, blague) •
tout en local</div>
 </div>
 </div>
 <div class="actions">
 <button class="btn ghost" id="themeBtn" title="Basculer clair/sombre">
🌗 Thème</button>
 <button class="btn" id="clearBtn" title="Effacer">🗑️ Effacer</button>
 <button class="btn primary" id="seedBtn" title="Exemples">✨ Exemple
s</button>
 </div>
 </div>
 <div class="chat" id="chat"></div>
 <div class="hint">Astuce : appuie sur <span class="kbd">Entrée</span> p
our envoyer, <span class="kbd">Shift</span> + <span class="kbd">Entrée</
span> pour une nouvelle ligne.</div>
 <div class="suggest" id="suggest"></div>
 <div class="composer">
 <div class="input">
 <input id="text" placeholder="Écris un message…" autocomplete="off" /
>
 </div>
 <button class="btn primary" id="sendBtn">Envoyer ⮕</button>
 </div>
 <div class="footer-note">Fonctionne hors-ligne · Aucun envoi de données
</div>
 </div>
Un mini-chatbot 20
 <script>
 // ====== Données & utilitaires ======
 const FAQ = {
 "bonjour": "Salut ! Comment puis-je t’aider ?",
 "qui es tu": "Je suis un petit chatbot en JavaScript (réplique du Python)🤖",
 "aide": "Tu peux me demander l’heure, une blague, ou des infos sur ce projet.",
 "comment ca va": "Super, merci ! Et toi ?",
 "aide projet": "Ce projet illustre un mini chatbot basé sur TF-IDF + règles, le tout côté client."
 };
 const SUGGESTIONS = [
 "Bonjour !",
 "Qui es-tu exactement ?",
 "Peux-tu m’aider pour le projet ?",
 "Raconte une blague",
 "Il est quelle heure ?"
 ];
 // Normalisation: minuscules, accents -> ascii, enlever ponctuation, espaces
 function normalize(text){
 const lower = (text || "").toLowerCase().normalize("NFD")
 .replace(/[\u0300-\u036f]/g, ""); // accents
 const noPunct = lower.replace(/[!"#$%&'()*+,\-.\/:;<=>?@\[\\\]^_`{|}~]/g, "");
 return noPunct.split(/\s+/).filter(Boolean).join(" ");
 }
 // Génération des n-grammes (1 et 2)
 function ngrams(tokens, nMin=1, nMax=2){
 const grams = [];
 for(let n=nMin; n<=nMax; n++){
 for(let i=0;i<=tokens.length - n;i++){
 grams.push(tokens.slice(i, i+n).join(" "));
 }
 }
 return grams;
 }
 // --- Construction du vocabulaire & IDF à partir des intentions
 const intents = Object.keys(FAQ);
 const intentsNorm = intents.map(normalize);
 const docsTokens = intentsNorm.map(t => ngrams(t.split(" "), 1, 2));
 const vocab = new Map(); // token -> index
 let idx = 0;
 const df = new Map(); // token -> document frequency
 docsTokens.forEach(tokens => {
 const set = new Set(tokens);
 set.forEach(tok=>{
 if(!vocab.has(tok)) vocab.set(tok, idx++);
 df.set(tok, (df.get(tok)||0) + 1);
 });
 });
 const N = intents.length;
 // idf(t) = log((N+1)/(df(t)+1)) + 1 (lisse un peu)
 const idf = new Float32Array(vocab.size);
 for(const [tok, i] of vocab.entries()){
 idf[i] = Math.log((N+1) / ((df.get(tok)||0) + 1)) + 1;
 }
 function tfVector(tokens){
 const vec = new Float32Array(vocab.size);
 const counts = new Map();
 tokens.forEach(t => counts.set(t, (counts.get(t)||0)+1));
 const denom = tokens.length || 1;
 for(const [t, c] of counts.entries()){
 const i = vocab.get(t);
 if(i !== undefined) vec[i] = (c/denom);
 }
 return vec;
 }
 function tfidfVector(text){
 const toks = ngrams(normalize(text).split(" "), 1, 2);
 const tf = tfVector(toks);
 for(let i=0;i<tf.length;i++){ tf[i] = tf[i] * idf[i]; }
 return tf;
 }
 function cosine(a, b){
 let dot = 0, na=0, nb=0;
 const L = a.length;
 for(let i=0;i<L;i++){
 const x=a[i], y=b[i];
 dot += x*y; na += x*x; nb += y*y;
 }
 if(na===0 || nb===0) return 0;
 return dot / (Math.sqrt(na)*Math.sqrt(nb));
 }
 // Pré-vectoriser les intentions
 const V_INTENTS = intents.map(q => tfidfVector(q));
 function bestIntent(message){
 const v = tfidfVector(message);
 let bestIdx = 0, bestScore = -1;
 for(let i=0;i<V_INTENTS.length;i++){
 const s = cosine(v, V_INTENTS[i]);
 if(s > bestScore){ bestScore = s; bestIdx = i; }
 }
 return { intent: intents[bestIdx], score: bestScore };
 }
 // Règles prioritaire (simple)
 function ruleBased(message){
 const m = normalize(message);
 if(m.includes("blague")){
 return "Pourquoi les programmeurs confondent Halloween et Noël ? Parce que OCT 31 == DEC 25.";
 }
 if(m.includes("heure")){
 const d = new Date();
 const hh = String(d.getHours()).padStart(2,"0");
 const mm = String(d.getMinutes()).padStart(2,"0");
 return `Il est ${hh}:${mm}`;
 }
 return null;
 }
 function answer(message){
 const rule = ruleBased(message);
 if(rule) return rule;
 const { intent, score } = bestIntent(message);
 // Seuil ajustable
 if(score >= 0.25){
 return FAQ[intent];
 } else {
 // proposer les 3 plus proches comme aide
 const v = tfidfVector(message);
 const ranked = intents.map((it, i)=>({ it, s: cosine(v, V_INTENTS[i]) }))
 .sort((a,b)=>b.s-a.s).slice(0,3);
 const sugg = ranked.map(r=>`« ${r.it} »`).join(", ");
 return `Je n’ai pas compris. Tu peux essayer: ${sugg}`;
 }
 }
 // ====== UI ======
 const chat = document.getElementById("chat");
 const text = document.getElementById("text");
 const sendBtn = document.getElementById("sendBtn");
 const clearBtn = document.getElementById("clearBtn");
 const themeBtn = document.getElementById("themeBtn");
 const seedBtn = document.getElementById("seedBtn");
 const suggest = document.getElementById("suggest");
 const PREF_THEME_KEY = "mini-bot-theme";
 function timeNow(){
 const d = new Date();
 return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
 }
function el(tag, attrs={}, ...children){
 const node = document.createElement(tag);
 Object.entries(attrs).forEach(([k,v])=>{
 if(k==="class") node.className = v;
 else if(k==="html") node.innerHTML = v;
 else node.setAttribute(k,v);
 });
 children.forEach(c => {
 if (c === null || c === undefined) return; // <-- important
 node.appendChild(typeof c==="string" ? document.createTextNode(c) : c);
 });
 return node;
}
 function addMessage(role, content){
 const row = el("div", { class:`msg ${role}` },
 role==="bot"? el("div", { class:"time"}, timeNow()) : null,
 el("div", { class:"bubble"}, content),
 role==="user"? el("div", { class:"time"}, timeNow()) : null
 );
 chat.appendChild(row);
 chat.scrollTop = chat.scrollHeight;
 }
 function send(){
 const val = text.value.trim();
 if(!val) return;
 addMessage("user", val);
 text.value = "";
 // mini “thinking” delay visuel (local)
 setTimeout(()=>{
 const rep = answer(val);
 addMessage("bot", rep);
 }, 120);
 }
 // suggestions cliquables
 function renderSuggestions(){
 suggest.innerHTML = "";
 SUGGESTIONS.forEach(s=>{
 const chip = el("button", { class:"chip", title:"Insérer" }, s);
 chip.addEventListener("click", ()=>{
 text.value = s;
 send();
 });
 suggest.appendChild(chip);
 });
 }
 // thème
 function applyTheme(theme){
 if(theme==="light"){ document.body.classList.add("light"); }
 else { document.body.classList.remove("light"); }
 localStorage.setItem(PREF_THEME_KEY, theme);
 }
 function toggleTheme(){
 const isLight = document.body.classList.contains("light");
 applyTheme(isLight? "dark":"light");
 }
 // seed de conversation
 function seed(){
 chat.innerHTML = "";
 addMessage("bot", "Salut ! Je suis un mini-chatbot local. Pose-moi une question (ex: « Qui es-tu ? », « Raconte une blague », « Il est quelle heure ? »).");
 }
 // events
 sendBtn.addEventListener("click", send);
 clearBtn.addEventListener("click", seed);
 seedBtn.addEventListener("click", ()=>{
 seed();
 renderSuggestions();
 });
 themeBtn.addEventListener("click", toggleTheme);
 text.addEventListener("keydown", (e)=>{
 if(e.key==="Enter" && !e.shiftKey){
 e.preventDefault();
 send();
 }
 });
 // init
 applyTheme(localStorage.getItem(PREF_THEME_KEY) || "dark");
 seed();
 renderSuggestions();
 </script>
</body>
